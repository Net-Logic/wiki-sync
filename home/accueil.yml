# Home page of https://wiki.netlogic.fr, published by the "Home page" workflow on a push to main.
# A module card: page (the wiki page, must exist), logo (a file already on the wiki, without File:),
# description (one paragraph of Markdown), optional dolistore (product id) and name (defaults to page).
title: Accueil
headline: Documentation des modules Net-Logic
intro: "Modules Dolibarr développés et maintenus par [Net-Logic](https://www.netlogic.fr). Chaque page détaille l'installation, la configuration et l'utilisation du module ; les modules se téléchargent sur DoliStore."
